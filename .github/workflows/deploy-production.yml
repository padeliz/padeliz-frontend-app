name: Deploy production

on:
  release:
    types: [published]

concurrency:
  group: deploy-app-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            registry.digitalocean.com/padeliz/padeliz-frontend-app:sha-${{ github.sha }}
            registry.digitalocean.com/padeliz/padeliz-frontend-app:production
          build-args: |
            EXPO_PUBLIC_BASE_URL=https://app.padeliz.ro
            EXPO_PUBLIC_SCHEME=padeliz-app://
            EXPO_PUBLIC_API_URL=https://backend.padeliz.ro/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to App Platform
        env:
          APP_NAME: padeliz-frontend-app-prod
          IMAGE_REPOSITORY: padeliz/padeliz-frontend-app
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENTS: web
        run: |
          python3 -m pip install --user pyyaml
          bash scripts/ci/deploy-app-platform.sh

  smoke:
    name: smoke-web
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Smoke web
        env:
          SMOKE_URL: https://app.padeliz.ro
        run: bash scripts/ci/smoke-web.sh
